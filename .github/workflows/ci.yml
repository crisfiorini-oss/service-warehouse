name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: go1.27.3

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.3"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  # Runs the agent's Runtime against the gateway image this repository builds:
  # the container starts, enforces the token the agent minted, and answers a
  # consumer who presents it. The unit tests cannot say whether the image the
  # Dockerfile produces serves what the agent expects of it.
  agent-runtime-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: build gateway image
        run: docker build -t service-warehouse:e2e .
      - name: end-to-end run through the agent runtime
        env:
          SWH_GATEWAY_IMAGE: service-warehouse:e2e
        run: go test -v -tags e2e -count=1 -timeout 300s -run TestRuntimeEndToEnd .

  # Inventories a real gateway image through the agent's own image-SBOM path and
  # checks it against the shared coverage contract, so a change that would ship
  # an uninventoried image fails here rather than at release.
  image-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: build gateway image
        run: docker build -t service-warehouse:e2e .
      # The daemon holds this image and no registry serves it, so the scan needs
      # syft on PATH: the managed containerized scanner has no Docker access.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: assert the image contract against a real image
        env:
          SWH_GATEWAY_IMAGE: service-warehouse:e2e
        run: go test -v -tags e2e -count=1 -timeout 300s -run TestImageSBOM .
      - name: write evidence through the release command
        run: go run ./cmd/image-sbom -image service-warehouse:e2e -local -out sbom
      # The local image is single-platform and reached through the daemon. The
      # image a release publishes is neither: it is multi-architecture and
      # resolved through the registry. Without this step the two-platform path
      # the release depends on would never execute in CI. It inventories the
      # digest gateway-image.json records — the image the agent actually names —
      # so a lock pointing at something that does not resolve, or that ships
      # fewer platforms than evidence has to cover, fails here rather than at
      # release time. The empty-lock exception ends at the first nonempty lock
      # in fetched history or any v* tag. Full history is required above, so
      # deleting an established digest cannot quietly skip the published scan.
      - name: inventory the published multi-architecture image
        run: |
          set -euo pipefail
          digest=$(jq -er '.digest' gateway-image.json)
          if [ -z "$digest" ]; then
            bash .github/scripts/allow-unpublished-image.sh
            echo "::notice::pre-release tree with no prior image lock: no published image to inventory"
            exit 0
          fi
          go run ./cmd/image-sbom -image "$(jq -er '.name + "@" + .digest' gateway-image.json)" -out sbom-published
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-image-sbom
          path: |
            sbom/
            sbom-published/
          # A skipped scan writes nothing; failing here keeps a green job from
          # standing in for evidence that was never produced. sbom/ is always
          # written, so this fails only when the local scan did not run.
          if-no-files-found: error
