# Full-lifecycle agent validation: `codefly agent ci` runs the source, release,
# and generated-service conformance gates against this agent, through the shared
# reusable workflow every codefly service agent uses.
#
# Runs on every pull request since the first full run went green on main
# (run 38167325616, release v0.0.2). Packaging needs Docker and
# source-packager/toolchain downloads; source validation alone does not prove
# the release and generated-service stages, so this stays its own workflow.
name: agent-ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  agent-ci:
    # Pinned to an immutable core commit SHA, not @main (see release.yml): core's
    # v0.19.4, the release go.mod requires. Bump the two together, which
    # TestCorePinsAreOneImmutableCommitMatchingGoMod holds.
    uses: codefly-dev/core/.github/workflows/agent-ci.yml@5b9dbf5d7f03dd048d7b741dc8b79ab2bc407ab3 # v0.19.4
    with:
      # The CLI release the gate runs with. agent.codefly.yaml selects the
      # source-packager version (0.0.69); go.mod selects Go 1.27.3.
      codefly-cli-version: "0.1.185"
